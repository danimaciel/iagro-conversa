name: Atualizar base e publicar página

# Todo mês: baixa a exportação do Redape, baixa e extrai só os PDFs novos (texto completo da Infoteca-e),
# divide em trechos, calcula vetores só dos trechos novos e publica. Textos e vetores ficam em cache
# como anexos da release "cache".
on:
  schedule:
    - cron: "0 12 12 * *"   # dia 12 de cada mês, 9h de Brasília (depois do iagro-embrapa)
  workflow_dispatch:
    inputs:
      mes:
        description: "Exportação AAAA-MM (vazio = mais recente)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  CACHE_TAG: cache
  UNIDADES: "Embrapa Territorial"

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.listar.outputs.partes }}
      mes: ${{ steps.baixar.outputs.mes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-base.txt }
      - run: pip install -r pipeline/requirements-base.txt
      - name: Baixar exportação do Redape
        id: baixar
        run: |
          python pipeline/redape.py ${{ inputs.mes }} | tee saida.txt
          echo "mes=$(tail -n 1 saida.txt)" >> "$GITHUB_OUTPUT"
      - run: python pipeline/documentos.py ${{ steps.baixar.outputs.mes }}
      - name: Baixar caches
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dados/cache
          gh release download "$CACHE_TAG" -D dados/cache || echo "sem cache ainda"
      - name: Listar PDFs novos
        id: listar
        run: |
          python pipeline/pdfs.py listar --partes 4 | tee saida.txt
          grep '^PARTES=' saida.txt | sed 's/^PARTES=/partes=/' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: preparado
          path: |
            dados/documentos.parquet
            dados/pdfs_faltam.parquet
          retention-days: 3

  pdfs:
    needs: preparar
    if: needs.preparar.outputs.partes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4   # poucas conexões simultâneas com os servidores da Embrapa
      matrix:
        parte: ${{ fromJSON(needs.preparar.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-base.txt }
      - run: pip install -r pipeline/requirements-base.txt
      - uses: actions/download-artifact@v4
        with: { name: preparado, path: dados }
      - run: python pipeline/pdfs.py baixar --parte ${{ matrix.parte }}
      - uses: actions/upload-artifact@v4
        with: { name: "textos-${{ matrix.parte }}", path: dados/textos_partes/, retention-days: 3 }

  trechos:
    needs: [preparar, pdfs]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.faltam.outputs.partes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-base.txt }
      - run: pip install -r pipeline/requirements-base.txt
      - uses: actions/download-artifact@v4
        with: { name: preparado, path: dados }
      - uses: actions/download-artifact@v4
        with: { pattern: textos-*, path: dados/textos_partes, merge-multiple: true }
      - name: Juntar textos e guardar o cache
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dados/cache
          gh release download "$CACHE_TAG" -D dados/cache || true
          python pipeline/pdfs.py juntar
          gh release view "$CACHE_TAG" >/dev/null 2>&1 || gh release create "$CACHE_TAG" --title "Cache (uso interno do fluxo)" --notes "Textos extraídos dos PDFs e vetores. Atualizado automaticamente."
          gh release upload "$CACHE_TAG" dados/cache/textos.jsonl.gz --clobber
      - run: python pipeline/trechos.py
      - name: Listar trechos sem vetor
        id: faltam
        run: |
          python pipeline/vetores.py faltam --partes 8 | tee saida.txt
          grep '^PARTES=' saida.txt | sed 's/^PARTES=/partes=/' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: trechos
          path: |
            dados/base.parquet
            dados/faltam.parquet
          retention-days: 3

  vetores:
    needs: trechos
    if: always() && needs.trechos.result == 'success' && needs.trechos.outputs.partes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        parte: ${{ fromJSON(needs.trechos.outputs.partes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-vetores.txt }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r pipeline/requirements-vetores.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-multilingual-e5-base }
      - uses: actions/download-artifact@v4
        with: { name: trechos, path: dados }
      - run: python pipeline/vetores.py calcular --parte ${{ matrix.parte }}
      - uses: actions/upload-artifact@v4
        with: { name: "parte-${{ matrix.parte }}", path: dados/partes/, retention-days: 3 }

  publicar:
    needs: [preparar, trechos, vetores]
    if: always() && needs.trechos.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements-base.txt }
      - run: pip install -r pipeline/requirements-base.txt
      - uses: actions/download-artifact@v4
        with: { name: preparado, path: dados }
      - uses: actions/download-artifact@v4
        with: { name: trechos, path: dados }
      - uses: actions/download-artifact@v4
        with: { pattern: parte-*, path: dados/partes, merge-multiple: true }
      - name: Juntar vetores e guardar o cache
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p dados/cache
          gh release download "$CACHE_TAG" -D dados/cache -p 'e5*' || true
          python pipeline/vetores.py juntar
          gh release upload "$CACHE_TAG" dados/cache/e5.npy dados/cache/e5_hash.parquet --clobber
      - run: python pipeline/site_dados.py ${{ needs.preparar.outputs.mes }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
